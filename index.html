  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700&display=swap" rel="stylesheet">

  <style>
    /* Tinggi layar di browser ponsel berubah saat bilah alamat menyusut.
       100vh selalu dihitung terhadap layar penuh, sehingga bagian bawah
       iframe ikut terpotong. Urutan di bawah dipakai dari yang paling
       akurat ke cadangan paling aman:
         1. --app-h  : hasil pengukuran JavaScript, paling presisi
         2. 100dvh   : satuan dinamis, didukung browser modern
         3. 100vh    : cadangan terakhir untuk browser lama            */
    :root {
      --app-h: 100vh;
      --brand: #2A6B7A;
      --brand-dark: #1E545C;
      --foam: #D8E8E9;
      --bg: #F4F8F8;
      --muted: #5F7276;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      background: var(--bg);
      overflow: hidden;
      overscroll-behavior: none;              /* cegah tarik-segarkan di atas iframe */
      -webkit-text-size-adjust: 100%;
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    }

    .app-frame {
      position: fixed;
      inset: 0;
      height: var(--app-h);
      height: 100dvh;
      display: block;
      background: var(--bg);
      /* hormati area aman ponsel berponi dan bilah gestur */
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      padding-left: env(safe-area-inset-left, 0px);
      padding-right: env(safe-area-inset-right, 0px);
    }

    iframe {
      display: block;                         /* hilangkan celah bawaan elemen inline */
      width: 100%;
      height: 100%;
      border: 0;
      background: var(--bg);
    }

    /* ===== Loader animasi Finesse: bulu digambar, terisi, lalu melayang ===== */
    .fl-loader{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
      background:radial-gradient(120% 80% at 50% 40%, #FFFFFF 0%, #F3F8F8 55%, #E6F0F0 100%);color:#5F7276;
      font-family:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif;transition:opacity .35s ease, visibility .35s}
    .fl-loader.fl-statis{position:static;min-height:100vh;min-height:100dvh;background:radial-gradient(120% 80% at 50% 40%, #FFFFFF 0%, #F3F8F8 55%, #E6F0F0 100%)}
    .fl-loader.hide{opacity:0;visibility:hidden;pointer-events:none}
    .fl-panggung{position:relative;width:132px;height:132px;display:flex;align-items:center;justify-content:center}
    .fl-riak{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(148,199,199,.55);animation:fl-riak 2.8s ease-out infinite;opacity:0}
    .fl-riak.r2{animation-delay:1.4s}
    .fl-latar{position:absolute;inset:18px;border-radius:50%;background:radial-gradient(circle, rgba(216,232,233,.9), rgba(216,232,233,0) 70%)}
    .fl-mark{position:relative;width:86px;height:auto;overflow:visible;transform-origin:30% 90%;animation:fl-melayang 3.2s ease-in-out infinite}
    .fl-bulu{fill:#2A6B7A;fill-opacity:0;stroke:#2A6B7A;stroke-width:4;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;
      animation:fl-gambar 2.8s cubic-bezier(.65,0,.35,1) infinite}
    .fl-b2{fill:#1E545C;stroke:#1E545C;animation-delay:.22s}
    .fl-kata{display:flex;gap:1px;font-weight:700;font-size:30px;letter-spacing:-.01em;color:#2A6B7A;line-height:1}
    .fl-kata span{display:inline-block;opacity:0;transform:translateY(10px);animation:fl-huruf .55s cubic-bezier(.2,.8,.2,1) forwards;
      animation-delay:calc(var(--i) * 70ms + 250ms)}
    .fl-sub{font-size:11px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:#93A5A8;margin-top:-8px;opacity:0;
      animation:fl-muncul .6s ease forwards .9s}
    .fl-jalur{width:150px;height:3px;border-radius:999px;background:#D8E8E9;overflow:hidden;opacity:0;animation:fl-muncul .6s ease forwards 1s}
    .fl-jalur span{display:block;width:40%;height:100%;border-radius:999px;background:linear-gradient(90deg,#94C7C7,#2A6B7A);animation:fl-geser 1.3s ease-in-out infinite}
    .fl-pesan{min-height:22px;font-size:13.5px;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#5F7276;text-align:center;
      max-width:320px;padding:0 20px;line-height:1.6;transition:opacity .3s ease}
    .fl-pesan a{color:#2A6B7A;font-weight:600}
    @keyframes fl-gambar{
      0%{stroke-dashoffset:1;fill-opacity:0;opacity:1}
      38%{stroke-dashoffset:0;fill-opacity:0}
      55%{stroke-dashoffset:0;fill-opacity:1}
      86%{fill-opacity:1;opacity:1}
      100%{stroke-dashoffset:0;fill-opacity:1;opacity:0}}
    @keyframes fl-melayang{0%,100%{transform:translateY(4px) rotate(-3deg)}50%{transform:translateY(-6px) rotate(3deg)}}
    @keyframes fl-riak{0%{transform:scale(.55);opacity:.9}100%{transform:scale(1.25);opacity:0}}
    @keyframes fl-huruf{to{opacity:1;transform:none}}
    @keyframes fl-muncul{to{opacity:1}}
    @keyframes fl-geser{0%{margin-left:-40%}100%{margin-left:100%}}
    /* versi ringkas di dalam halaman */
    .fl-mini{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:52px 18px;color:#5F7276}
    .fl-mini .fl-panggung{width:84px;height:84px}
    .fl-mini .fl-latar{inset:10px}
    .fl-mini .fl-mark{width:46px}
    .fl-mini .fl-teks{font-size:13.2px}
    @media (prefers-reduced-motion:reduce){
      .fl-bulu{animation:none;fill-opacity:1;stroke-dashoffset:0}
      .fl-mark,.fl-riak,.fl-jalur span{animation:none}
      .fl-riak{display:none}
      .fl-kata span,.fl-sub,.fl-jalur{animation:none;opacity:1;transform:none}
    }
  </style>
</head>
<body>

    <div class="fl-kata" aria-label="Finesse"><span style="--i:0">F</span><span style="--i:1">i</span><span style="--i:2">n</span><span style="--i:3">e</span><span style="--i:4">s</span><span style="--i:5">s</span><span style="--i:6">e</span></div>

  <div class="app-frame">
    <!-- src diisi otomatis dari APP_URL di bawah -->
    <iframe
      id="app"
      title="Finesse Mental Health Check Up"
      allow="clipboard-write; fullscreen"
      allowfullscreen></iframe>
  </div>

  <script>
    /* ===== PENGATURAN: cukup ganti URL di bawah ini ===== */
    var APP_URL = 'https://script.google.com/macros/s/AKfycbzk7TlfFbjNO-SwnPjbdzfQ1OlwmKPxiMi3i0Y5jxxJTr_yJwNkK5knOYC03s_1ywmIMA/exec';
    /* ==================================================== */

    (function () {
      var root = document.documentElement;

      /* Ukur tinggi tampak yang sebenarnya. visualViewport mengikuti
         penyusutan bilah alamat secara langsung, jadi dipakai lebih dulu. */
      function ukur() {
        var h = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
        root.style.setProperty('--app-h', h + 'px');
      }

      ukur();
      window.addEventListener('resize', ukur);
      window.addEventListener('orientationchange', function () { setTimeout(ukur, 250); });
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', ukur);
        window.visualViewport.addEventListener('scroll', ukur);
      }

      /* Sembunyikan loader setelah iframe siap, dengan batas waktu
         supaya tidak menggantung bila pemuatan lambat. */
      var frame = document.getElementById('app');
      var loader = document.getElementById('loader');
      var selesai = false;

      /* Pesan bergantian agar penantian terasa hidup */
      var pesan = document.getElementById('fl-pesan');
      var daftarPesan = ['Menyiapkan ruang aman untuk Anda…', 'Memuat asesmen kesehatan mental…',
        'Hampir siap, tarik napas sejenak…'];
      var urutan = 0;
      var putar = setInterval(function () {
        urutan = (urutan + 1) % daftarPesan.length;
        pesan.style.opacity = 0;
        setTimeout(function () { pesan.textContent = daftarPesan[urutan]; pesan.style.opacity = 1; }, 300);
      }, 2600);
      function tampilPesan(html) { clearInterval(putar); pesan.style.opacity = 1; pesan.innerHTML = html; }

      /* Pengaman bila URL belum diganti, supaya tidak tampil halaman error Google */
      if (!/^https:\/\/script\.google\.com\/.+\/exec/.test(APP_URL) || APP_URL.indexOf('ISI_ID_DEPLOYMENT') >= 0) {
        document.querySelector('.fl-jalur').style.display = 'none';
        tampilPesan(
          '<b>URL aplikasi belum diisi.</b><br>Buka file index.html, cari baris ' +
          '<code>APP_URL</code>, lalu tempel URL Web App Apps Script yang berakhiran <code>/exec</code>.');
        return;
      }
      frame.src = APP_URL;

      function tutupLoader() {
        if (selesai) return;
        selesai = true;
        clearInterval(putar);
        setTimeout(function () {
          loader.classList.add('hide');
          setTimeout(function () { loader.style.display = 'none'; }, 400);
        }, 350);
      }

      frame.addEventListener('load', tutupLoader);
      setTimeout(tutupLoader, 12000);

      /* Peserta tidak perlu akun Google (web app diakses Anyone), jadi
         pesan bantuan cukup mengarahkan ke koneksi dan tautan langsung. */
      setTimeout(function () {
        if (selesai) return;
        tampilPesan('Masih memuat. Bila tidak terbuka juga, periksa koneksi internet Anda, ' +
          'lalu buka <a href="' + frame.src + '" target="_blank" rel="noopener">aplikasinya langsung</a>.');
      }, 8000);
    })();
  </script>
